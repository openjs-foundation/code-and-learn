# Lint, format check, and build at a given ref. Called by CI on every push and
# pull request, and by the staging deploy before it ships anything.
name: Checks

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the triggering commit)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
